<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient - Full Bleed -->
    <radialGradient id="bgGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="60%" stop-color="#080C16" />
      <stop offset="100%" stop-color="#04060B" />
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Orb Core Radial Glow -->
    <radialGradient id="orbCoreM" cx="38%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#E0F7FF" />
      <stop offset="25%" stop-color="#00F0FF" />
      <stop offset="65%" stop-color="#8B5CF6" />
      <stop offset="90%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#090D1A" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonBloomM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseBloomM" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full Bleed Background for Safe-Zone Masking -->
  <rect width="512" height="512" fill="url(#bgGlowM)" />

  <!-- Scaled content inside 80% safe zone (center 410px) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Ambient Cyber Mesh Rings -->
    <circle cx="256" cy="256" r="226" fill="none" stroke="#00F0FF" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="198" fill="none" stroke="#8B5CF6" stroke-opacity="0.14" stroke-width="1.5" />
    <circle cx="256" cy="256" r="172" fill="none" stroke="#00F0FF" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="12 12" />

    <!-- Outer Glowing Chroma Ring with Neon Bloom -->
    <circle cx="256" cy="256" r="162" fill="none" stroke="url(#ringGradM)" stroke-width="5" filter="url(#intenseBloomM)" opacity="0.9" />

    <!-- Floating Orbital Gyro Rings -->
    <ellipse cx="256" cy="256" rx="160" ry="68" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.75" transform="rotate(-28 256 256)" />
    <ellipse cx="256" cy="256" rx="160" ry="68" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.65" stroke-dasharray="8 6" transform="rotate(38 256 256)" />

    <!-- Central Futuristic 3D AI Orb Sphere -->
    <g filter="url(#intenseBloomM)">
      <circle cx="256" cy="256" r="112" fill="url(#orbCoreM)" />
      <!-- Specular Highlight -->
      <ellipse cx="218" cy="198" rx="42" ry="24" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(-30 218 198)" />
      <circle cx="204" cy="186" r="10" fill="#FFFFFF" fill-opacity="0.85" />
    </g>

    <!-- Stylized Holographic "A" Neural Monogram in Center -->
    <g filter="url(#neonBloomM)">
      <path d="M 256 182 L 202 312 L 228 312 L 242 278 L 270 278 L 284 312 L 310 312 Z M 256 230 L 265 258 L 247 258 Z"
            fill="#FFFFFF" />
      <line x1="222" y1="268" x2="290" y2="268" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Glowing Satellite Luminous Nodes -->
    <circle cx="114" cy="214" r="5" fill="#00F0FF" filter="url(#neonBloomM)" />
    <circle cx="398" cy="298" r="5" fill="#EC4899" filter="url(#neonBloomM)" />
    <circle cx="340" cy="136" r="4" fill="#8B5CF6" filter="url(#neonBloomM)" />
    <circle cx="172" cy="376" r="4.5" fill="#00F0FF" filter="url(#neonBloomM)" />

    <!-- Dynamic Wave Crests -->
    <path d="M 170 348 Q 210 332, 256 348 T 342 348" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#neonBloomM)" />
  </g>
</svg>
